<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./../style/styles.css">
</head>

<body>
    <h1>CRUD de Productos</h1>
    <button onclick="window.location.href = 'principal.html'">Volver</button>
    <section>
        <h2>Agregar producto</h2>
        <form id="productForm">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="number" id="precio" placeholder="Precio" required>
            <input type="text" id="descripcion" placeholder="Descripción" required>
            <button type="submit">Agregar</button>
        </form>
    </section>  
    <section>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="productTableBody">

            </tbody>
        </table>
    </section>


    <script type="module">
        import CrudProducto from "./../js/crudproducto.js";
        const nuevoProducto = new CrudProducto();

        function iniciar() {
            nuevoProducto.mostrarInformacion();
        }

        document.getElementById('productForm').addEventListener('submit', function (event) {
            event.preventDefault();
            nuevoProducto.crearProducto();
        });



        iniciar();
    </script>

</body>

</html>
