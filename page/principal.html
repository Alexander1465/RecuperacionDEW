<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./../style/styles.css">

<body>

    <script type="module">
        import Producto from "./../js/producto.js";
        import Carrito from "./../js/carrito.js";
        const producto = new Producto();
        const carrito = new Carrito();

        const datosUsuario = JSON.parse(localStorage.getItem("datosUsuario"));
        console.log(datosUsuario);
        if (datosUsuario.role === "admin") {
            const menul = document.getElementById("Menu");
            const liCrud = document.createElement("li");
            liCrud.textContent = "Crud Productos";
            liCrud.addEventListener("click", () => {
                window.location.href = "crudproducto.html";
            });
            const liGrafica = document.createElement("li");
            liGrafica.textContent = "Gráfica";
            liGrafica.addEventListener("click", () => {
                window.location.href = "chart.html";
            });
            const liCerrarSesion = document.createElement("li");
            liCerrarSesion.textContent = "Cerrar Sesión";
            liCerrarSesion.addEventListener("click", () => {
                localStorage.removeItem("datosUsuario");
                localStorage.removeItem("datosProductos");
                localStorage.removeItem("carrito");
                window.location.href = "login.html";
            });

            menul.appendChild(liCrud);
            menul.appendChild(liGrafica);
            menul.appendChild(liCerrarSesion);
        } else {
            const menul = document.getElementById("Menu");
            const liGrafica = document.createElement("li");

</body>

</html>
